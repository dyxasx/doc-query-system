[build]
  publish = "public"
  functions = "netlify-functions"

[build.environment]
  NODE_VERSION = "18"

# 重写规则：/api/* 请求转发到 Netlify Functions（force=true 优先匹配）
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Functions 路径直接转发
[[redirects]]
  from = "/.netlify/functions"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA 回退：HTML 页面找不到时回退到 index.html（force=false，避免覆盖 functions）
# 排除 .html 和 API 路径
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false