<!DOCTYPE html>
<html lang="zh-CN">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#1565C0;--primary-d:#0D47A1;--accent:#00BFA5;--bg:#F5F7FA;--card:#fff;--text:#1a1a2e;--text-l:#64748b;--border:#e2e8f0;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 12px 40px rgba(0,0,0,.1);--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* Hero */
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);color:#fff;padding:60px 20px 80px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:-50px;left:50%;transform:translateX(-50%);width:120%;height:100px;background:var(--bg);border-radius:50%}
.hero h1{font-size:2.2em;font-weight:800;margin-bottom:12px;letter-spacing:1px}
.hero p{font-size:1.1em;opacity:.92;max-width:600px;margin:0 auto 28px}
.hero-badges{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-badge{background:rgba(255,255,255,.15);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);padding:8px 18px;border-radius:30px;font-size:.85em;font-weight:500}

/* Container */
.container{max-width:960px;margin:0 auto;padding:0 16px}

/* Stats */
.stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:-40px 0 50px;position:relative;z-index:1}
.stat-card{background:var(--card);padding:20px 30px;border-radius:var(--radius);box-shadow:var(--shadow-lg);text-align:center;min-width:130px}
.stat-num{font-size:2em;font-weight:800;color:var(--primary);line-height:1}
.stat-label{font-size:.82em;color:var(--text-l);margin-top:6px}

/* Section */
.section{margin-bottom:50px}
.section-title{font-size:1.5em;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.section-title i{color:var(--accent)}
.section-desc{color:var(--text-l);font-size:.92em;margin-bottom:24px}

/* Product grid */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.product-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;border:1px solid var(--border)}
.product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.product-head{padding:24px 24px 16px;background:linear-gradient(135deg,rgba(21,101,192,.04),rgba(0,191,165,.04))}
.product-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-d));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:14px}
.product-name{font-size:1.2em;font-weight:700;margin-bottom:4px}
.product-model{font-size:.85em;color:var(--accent);font-weight:600;font-family:"SF Mono",Consolas,monospace}
.product-body{padding:0 24px 20px}
.product-desc{font-size:.9em;color:var(--text-l);margin-bottom:16px;line-height:1.6}
.product-specs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.spec-tag{background:var(--bg);border:1px solid var(--border);padding:3px 10px;border-radius:8px;font-size:.78em;color:var(--text-l)}

/* Doc list */
.doc-list{border-top:1px solid var(--border);padding-top:14px}
.doc-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.88em;border-bottom:1px solid var(--border)}
.doc-item:last-child{border-bottom:none}
.doc-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.doc-icon.pdf{background:rgba(239,68,68,.1);color:#ef4444}
.doc-icon.docx{background:rgba(37,99,235,.1);color:#2563eb}
.doc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-lang{font-size:.75em;color:var(--text-l);background:var(--bg);padding:2px 8px;border-radius:6px;flex-shrink:0}
.doc-btn{padding:5px 12px;border-radius:7px;font-size:.8em;font-weight:600;border:none;cursor:pointer;flex-shrink:0;transition:.2s}

/* Footer */
.footer{background:var(--text);color:rgba(255,255,255,.7);padding:40px 20px 30px;text-align:center;margin-top:60px}
.footer-brand{font-size:1.15em;font-weight:700;color:#fff;margin-bottom:10px}
.footer p{font-size:.85em;margin-bottom:6px}
.footer a{color:var(--accent)}

/* Mobile */
@media(max-width:640px){
.hero{padding:40px 16px 70px}
.hero h1{font-size:1.6em}
.hero p{font-size:.95em}
.stats{gap:10px;margin:-30px 0 40px}
.stat-card{padding:14px 20px;min-width:100px}
.stat-num{font-size:1.6em}
.section-title{font-size:1.25em}
.product-grid{grid-template-columns:1fr}
}
</style>
</head>
