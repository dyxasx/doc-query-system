<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <!-- 搜索区 -->
    <div class="search-section">
      <div class="search-bar">
        <input type="text" id="searchInput" data-i18n-ph="search_ph" placeholder="搜索文档标题或描述...">
        <button class="btn btn-primary" onclick="doSearch()">
          <i class="fa-solid fa-search"></i> <span data-i18n="search_btn">搜索</span>
        </button>
      </div>
      <div class="category-filter" id="categoryFilter"></div>
    </div>

    <!-- 文档列表 -->
    <div id="docListArea">
      <div class="doc-grid" id="docGrid"></div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <i class="fa-solid fa-folder-open"></i>
        <p style="font-size:18px;margin-bottom:8px;" data-i18n="no_docs">暂无文档</p>
        <p data-i18n="no_docs_hint">文档上传后将在这里展示</p>
      </div>
      <div id="pagination" class="pagination"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/static-adapter.js"></script>
  <script>
    let currentPage = 1;
    let currentKeyword = "";
    let currentCategory = "";
    let totalPages = 1;

    // 初始化导航 + 应用语言
    document.getElementById("navbar").innerHTML = renderNavbar("home");
    applyI18n();
    document.title = t("app_title");

    // 加载分类
    async function loadCategories() {
      try {
        const data = await api("/categories");
        const filterEl = document.getElementById("categoryFilter");
        let html = '<div class="cat-chip ' + (currentCategory === "" ? "active" : "") + '" onclick="selectCategory(\'\')">' + t("all_categories") + '</div>';
        data.categories.forEach(function(cat) {
          html += '<div class="cat-chip ' + (currentCategory === cat.id ? "active" : "") + '" onclick="selectCategory(\'' + cat.id + '\')">' +
            '<i class="fa-solid ' + cat.icon + '"></i> ' + cat.name + ' (' + cat.docCount + ')</div>';
        });
        filterEl.innerHTML = html;
      } catch(e) {
        console.error("Failed to load categories:", e);
      }
    }

    function selectCategory(catId) {
      currentCategory = catId;
      currentPage = 1;
      loadDocuments();
      loadCategories();
    }

    function doSearch() {
      currentKeyword = document.getElementById("searchInput").value.trim();
      currentPage = 1;
      loadDocuments();
    }

    document.getElementById("searchInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") doSearch();
    });

    // 加载文档列表
    async function loadDocuments() {
      let url = "/documents?page=" + currentPage;
      if (currentKeyword) url += "&q=" + encodeURIComponent(currentKeyword);
      if (currentCategory) url += "&category=" + currentCategory;

      try {
        const data = await api(url);
        const grid = document.getElementById("docGrid");
        const empty = document.getElementById("emptyState");

        if (data.documents.length === 0) {
          grid.innerHTML = "";
          empty.style.display = "block";
        } else {
          empty.style.display = "none";
          grid.innerHTML = data.documents.map(function(doc) {
            return '<div class="doc-card" onclick="location.href=\'view.html?id=' + doc.id + '\'">' +
              '<div class="doc-card-header">' +
                '<div class="doc-icon"><i class="fa-solid ' + doc.fileIcon + '"></i></div>' +
                '<div>' +
                  '<div class="doc-card-title">' + doc.title + '</div>' +
                  '<div class="doc-card-desc">' + (doc.description || t("no_desc")) + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="doc-card-footer">' +
                (doc.category ? '<span class="doc-card-cat"><i class="fa-solid ' + doc.category.icon + '"></i> ' + doc.category.name + '</span>' : '<span></span>') +
                '<span>' + doc.fileSizeFormatted + '</span>' +
              '</div>' +
            '</div>';
          }).join("");
        }

        totalPages = data.totalPages;
        renderPagination(data.page, data.totalPages, data.total);
      } catch(e) {
        showToast(t("load_failed") + ": " + e.message, "error");
      }
    }

    function renderPagination(page, totalPages, total) {
      const el = document.getElementById("pagination");
      if (totalPages <= 1) {
        el.innerHTML = '<span class="page-info">' + t("total_docs_only", { n: total }) + '</span>';
        return;
      }
      let html = "";
      html += '<button onclick="goPage(' + (page - 1) + ')" ' + (page <= 1 ? "disabled" : "") + '><i class="fa-solid fa-chevron-left"></i></button>';
      html += '<span class="page-info">' + t("page_info", { p: page, t: totalPages, n: total }) + '</span>';
      html += '<button onclick="goPage(' + (page + 1) + ')" ' + (page >= totalPages ? "disabled" : "") + '><i class="fa-solid fa-chevron-right"></i></button>';
      el.innerHTML = html;
    }

    function goPage(p) {
      currentPage = p;
      loadDocuments();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 语言切换时刷新动态内容
    window.onLangChange = function() {
      document.title = t("app_title");
      loadCategories();
      loadDocuments();
    };

    // 初始化
    loadCategories();
    loadDocuments();
  </script>
</body>
</html>
