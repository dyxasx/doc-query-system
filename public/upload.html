<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传文档</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container" style="max-width:700px;">
    <h2 style="margin-bottom:24px;"><i class="fa-solid fa-upload"></i> <span data-i18n="page_title_upload">上传文档</span></h2>

    <div class="search-section">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <div style="font-size:18px;margin-bottom:4px;" id="uploadZoneText" data-i18n="drop_hint">点击选择文件 或拖拽到此处</div>
        <div style="font-size:13px;color:var(--text-light);" data-i18n="file_type_hint">支持 PDF / Word / Excel / PPT / 图片 / TXT / 压缩包等（最大 25MB，超过自动压缩图片）</div>
        <input type="file" id="fileInput" style="display:none;" onchange="onFileSelected(this)">
      </div>

      <div id="fileForm" style="display:none;margin-top:24px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:12px 16px;background:var(--bg);border-radius:8px;">
          <i class="fa-solid fa-file" id="filePreviewIcon" style="font-size:24px;color:var(--primary);"></i>
          <div style="flex:1;">
            <div style="font-weight:500;" id="fileNameDisplay"></div>
            <div style="font-size:13px;color:var(--text-light);" id="fileSizeDisplay"></div>
          </div>
          <button class="btn btn-outline btn-sm" onclick="resetFile()"><i class="fa-solid fa-xmark"></i> <span data-i18n="btn_remove">移除</span></button>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="doc_title_label">文档标题</label>
          <input type="text" class="form-control" id="title" data-i18n-ph="title_ph" placeholder="留空则使用文件名">
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="doc_desc_label">文档描述</label>
          <textarea class="form-control" id="description" data-i18n-ph="desc_ph" placeholder="简要描述文档内容（可选）"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="doc_cat_label">所属分类</label>
          <select class="form-control" id="categorySelect"></select>
        </div>

        <button class="btn btn-primary" style="width:100%;justify-content:center;" id="uploadBtn" onclick="uploadFile()">
          <i class="fa-solid fa-upload"></i> <span data-i18n="btn_start_upload">开始上传</span>
        </button>
      </div>

      <div id="progressArea" style="display:none;margin-top:20px;">
        <div style="background:var(--bg);border-radius:8px;padding:20px;text-align:center;">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:32px;color:var(--primary);"></i>
          <div style="margin-top:12px;" id="progressText">正在上传...</div>
          <div id="progressBar" style="margin-top:12px;background:#e5e7eb;border-radius:4px;height:8px;overflow:hidden;">
            <div id="progressBarFill" style="height:100%;background:var(--primary);width:0%;transition:width 0.3s;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!Auth.isLoggedIn()) { location.href = "/login.html"; }
    document.getElementById("navbar").innerHTML = renderNavbar("admin");
    applyI18n();
    document.title = t("page_title_upload");

    let selectedFile = null;

    function getFileIcon(filename) {
      var ext = filename.split(".").pop().toLowerCase();
      var map = {
        pdf:"fa-file-pdf", doc:"fa-file-word", docx:"fa-file-word",
        xls:"fa-file-excel", xlsx:"fa-file-excel", ppt:"fa-file-powerpoint", pptx:"fa-file-powerpoint",
        txt:"fa-file-lines", md:"fa-file-lines", csv:"fa-file-csv",
        png:"fa-file-image", jpg:"fa-file-image", jpeg:"fa-file-image",
        gif:"fa-file-image", bmp:"fa-file-image", webp:"fa-file-image", svg:"fa-file-image",
        zip:"fa-file-zipper", rar:"fa-file-zipper", "7z":"fa-file-zipper",
      };
      return map[ext] || "fa-file";
    }

    function getMimeType(filename) {
      var ext = filename.split(".").pop().toLowerCase();
      var map = {
        pdf:"application/pdf",
        txt:"text/plain", md:"text/plain", csv:"text/csv",
        png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg",
        gif:"image/gif", bmp:"image/bmp", webp:"image/webp", svg:"image/svg+xml",
        doc:"application/msword", docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        xls:"application/vnd.ms-excel", xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        ppt:"application/vnd.ms-powerpoint", pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",
      };
      return map[ext] || "application/octet-stream";
    }

    const uploadZone = document.getElementById("uploadZone");
    uploadZone.addEventListener("dragover", function(e) { e.preventDefault(); uploadZone.classList.add("dragover"); });
    uploadZone.addEventListener("dragleave", function() { uploadZone.classList.remove("dragover"); });
    uploadZone.addEventListener("drop", function(e) {
      e.preventDefault();
      uploadZone.classList.remove("dragover");
      if (e.dataTransfer.files.length) {
        document.getElementById("fileInput").files = e.dataTransfer.files;
        onFileSelected({ files: e.dataTransfer.files });
      }
    });

    function onFileSelected(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      const isImage = ["image/jpeg", "image/png", "image/webp"].includes(file.type);

      if (file.size > 25 * 1024 * 1024) {
        if (isImage) {
          showToast(t("img_over_25"), "success");
        } else {
          var ext = file.name.split(".").pop().toLowerCase();
          var tips = t("file_too_large", { s: formatSize(file.size) });
          if (ext === "pdf") {
            tips += " " + t("tip_pdf");
          } else if (["doc", "docx", "ppt", "pptx"].includes(ext)) {
            tips += " " + t("tip_doc");
          } else if (["zip", "rar", "7z"].includes(ext)) {
            tips += " " + t("tip_zip");
          } else {
            tips += " " + t("tip_generic");
          }
          showToast(tips, "error");
          return;
        }
      }

      selectedFile = file;
      document.getElementById("uploadZoneText").removeAttribute("data-i18n");
      document.getElementById("uploadZoneText").textContent = file.name;
      document.getElementById("filePreviewIcon").className = "fa-solid " + getFileIcon(file.name);
      document.getElementById("fileNameDisplay").textContent = file.name;
      document.getElementById("fileSizeDisplay").textContent = formatSize(file.size);
      document.getElementById("fileForm").style.display = "block";
      document.getElementById("title").value = file.name.replace(/\.[^.]+$/, "");
    }

    function resetFile() {
      selectedFile = null;
      document.getElementById("fileInput").value = "";
      // 恢复提示文案的翻译标记并应用当前语言
      var zoneText = document.getElementById("uploadZoneText");
      zoneText.setAttribute("data-i18n", "drop_hint");
      zoneText.textContent = t("drop_hint");
      document.getElementById("fileForm").style.display = "none";
    }

    async function loadCategories() {
      try {
        const data = await api("/categories");
        const select = document.getElementById("categorySelect");
        select.innerHTML = '<option value="">' + t("no_cat") + '</option>' +
          data.categories.map(function(c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join("");
      } catch(e) { console.error(e); }
    }

    function setProgress(p) {
      document.getElementById("progressBarFill").style.width = p + "%";
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const chunkSize = 8192;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    // ========== 图片自动压缩 ==========
    // 超过 1MB 的图片自动用 canvas 压缩（JPG/PNG/WebP）
    async function compressImage(file) {
      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) return file;
      if (file.size <= 1024 * 1024) return file; // 1MB 内不压

      return new Promise(function(resolve) {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = function() {
          URL.revokeObjectURL(url);
          let quality = 0.8;
          let w = img.width, h = img.height;

          // 长边超 3000px 则缩小
          const maxSide = 3000;
          if (w > maxSide || h > maxSide) {
            const scale = maxSide / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }

          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);

          const tryCompress = function(q) {
            canvas.toBlob(function(blob) {
              if (blob && blob.size < file.size) {
                // 压缩有效，返回新 File
                const newFile = new File([blob], file.name.replace(/\.(png|webp)$/i, ".jpg"), { type: "image/jpeg" });
                resolve(newFile);
              } else if (q > 0.3) {
                tryCompress(q - 0.2);
              } else {
                resolve(file); // 压不动了，用原文件
              }
            }, "image/jpeg", q);
          };
          tryCompress(quality);
        };
        img.onerror = function() { resolve(file); };
        img.src = url;
      });
    }

    async function uploadFile() {
      if (!selectedFile) { showToast(t("select_file_first"), "error"); return; }

      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const categoryId = document.getElementById("categorySelect").value;

      document.getElementById("uploadBtn").disabled = true;
      document.getElementById("progressArea").style.display = "block";
      document.getElementById("progressText").textContent = t("progress_preparing");
      setProgress(5);

      try {
        let fileToUpload = selectedFile;

        // 大图片先自动压缩
        if (selectedFile.size > 2 * 1024 * 1024) {
          const isImage = ["image/jpeg", "image/png", "image/webp"].includes(selectedFile.type);
          if (isImage) {
            document.getElementById("progressText").textContent = t("progress_compressing");
            setProgress(10);
            fileToUpload = await compressImage(selectedFile);
            if (fileToUpload.size > 25 * 1024 * 1024) {
              showToast(t("img_still_large"), "error");
              document.getElementById("uploadBtn").disabled = false;
              document.getElementById("progressArea").style.display = "none";
              return;
            }
            showToast(t("img_compressed", { a: formatSize(selectedFile.size), b: formatSize(fileToUpload.size) }));
          }
        }

        document.getElementById("progressText").textContent = t("progress_reading");
        setProgress(20);

        const arrayBuffer = await fileToUpload.arrayBuffer();
        const base64Data = arrayBufferToBase64(arrayBuffer);

        document.getElementById("progressText").textContent = t("progress_uploading");
        setProgress(50);

        await api("/documents", {
          method: "POST",
          body: JSON.stringify({
            title: title,
            description: description,
            categoryId: categoryId,
            filename: fileToUpload.name,
            filetype: fileToUpload.name.split(".").pop().toLowerCase(),
            mimeType: getMimeType(fileToUpload.name),
            fileData: base64Data,
          }),
        });

        setProgress(100);
        document.getElementById("progressText").textContent = t("upload_success");
        showToast(t("upload_success"));
        setTimeout(function() { location.href = "/admin.html"; }, 1000);
      } catch(err) {
        showToast(err.message, "error");
        document.getElementById("uploadBtn").disabled = false;
        document.getElementById("progressArea").style.display = "none";
      }
    }

    // 语言切换时刷新动态内容（分类下拉框、上传区文案）
    window.onLangChange = function() {
      document.title = t("page_title_upload");
      loadCategories();
      // 已选文件时显示文件名，否则显示提示文案
      if (!selectedFile) {
        document.getElementById("uploadZoneText").textContent = t("drop_hint");
      }
    };

    loadCategories();
  </script>
</body>
</html>
