<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-title">
        <i class="fa-solid fa-lock" style="color:var(--primary);"></i>
        <div style="margin-top:8px;" data-i18n="login_title">管理员登录</div>
      </div>
      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label class="form-label" data-i18n="username">用户名</label>
          <input type="text" class="form-control" id="username" data-i18n-ph="username_ph" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="password">密码</label>
          <input type="password" class="form-control" id="password" data-i18n-ph="password_ph" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
          <i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="login_btn">登录</span>
        </button>
      </form>
      <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-light);" data-i18n="default_account">
        默认账号: admin / admin123
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById("navbar").innerHTML = renderNavbar();
    applyI18n();
    document.title = t("login_title");
    if (Auth.isLoggedIn()) location.href = "/admin.html";

    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      try {
        const data = await api("/login", {
          method: "POST",
          body: JSON.stringify({ username, password }),
        });
        Auth.setToken(data.token);
        Auth.setUsername(data.username);
        showToast(t("login_success"));
        setTimeout(function() { location.href = "/admin.html"; }, 500);
      } catch(err) {
        showToast(err.message, "error");
      }
      return false;
    }

    // 语言切换时刷新
    window.onLangChange = function() {
      document.title = t("login_title");
    };
  </script>
</body>
</html>
