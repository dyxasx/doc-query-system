<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-title">
        <i class="fa-solid fa-lock" style="color:var(--primary);"></i>
        <div style="margin-top:8px;">管理员登录</div>
      </div>
      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
          <i class="fa-solid fa-right-to-bracket"></i> 登录
        </button>
      </form>
      <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-light);">
        默认账号: admin / admin123
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById("navbar").innerHTML = renderNavbar();
    if (Auth.isLoggedIn()) location.href = "/admin.html";

    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      try {
        const data = await api("/login", {
          method: "POST",
          body: JSON.stringify({ username, password }),
        });
        Auth.setToken(data.token);
        Auth.setUsername(data.username);
        showToast("登录成功");
        setTimeout(function() { location.href = "/admin.html"; }, 500);
      } catch(err) {
        showToast(err.message, "error");
      }
      return false;
    }
  </script>
</body>
</html>
